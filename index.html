    .minimal-card {

    /* Clean Vibrant Telegram Action Button */

    }

    .telegram-pill-btn:hover {
      transform: translateY(-2px) scale(1.015);
      background: linear-gradient(135deg, #0088cc 0%, #0284c7 100%);
      box-shadow: 0 16px 32px -6px rgba(0, 136, 204, 0.42);
    }

    .telegram-pill-btn:active {
      transform: scale(0.98);
    }

    /* Subtle Shimmer Sweep on Button */
    .telegram-pill-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 45%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.22) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-22deg);
      animation: softGlide 3.4s infinite;
    }

    @keyframes softGlide {
      0% { left: -80%; }
      45% { left: 140%; }
      100% { left: 140%; }
    }

    /* Minimalist Countdown Pill Box */
    .timer-pill-box {
      background: #f4f4f5;
      border: 1px solid #e4e4e7;

  <!-- 20-Second Auto-Redirect Script -->
  <script>
    (function () {
      const CHANNEL_URL = "https://telegram.me/+MAxxNJaoJYEyMDM1";
      const TOTAL_SEC = 3;
      let left = TOTAL_SEC;

      const secEl = document.getElementById("countdownSec");
      const labelEl = document.getElementById("timerLabel");
      const barEl = document.getElementById("timerProgress");

      const timer = setInterval(() => {
        left -= 1;

        if (left > 0) {
          secEl.textContent = left < 10 ? "0" + left : String(left);
          barEl.style.width = ((left / TOTAL_SEC) * 100) + "%";
        } else {
          clearInterval(timer);
          secEl.textContent = "00";
          barEl.style.width = "0%";
          labelEl.textContent = "Redirecting to Telegram...";
          labelEl.classList.remove("text-zinc-600");
          labelEl.classList.add("text-emerald-600");

          // Open Telegram channel automatically when 20s timer completes
          window.location.href = CHANNEL_URL;
        }
      }, 1000);
    })();
  </script>
